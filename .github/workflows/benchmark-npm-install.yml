name: Benchmark npm install

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: windows-11-arm
    env:
      npm_config_fund: 'false'
      npm_config_audit: 'false'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      # === npm benchmarks ===

      - name: 'npm: cold install (no caches)'
        run: |
          npm cache clean --force
          $start = Get-Date
          npm ci --no-fund --no-audit 2>&1 | Select-Object -Last 3
          $elapsed = (Get-Date) - $start
          Write-Output "npm cold: $([math]::Round($elapsed.TotalSeconds))s"
        shell: pwsh

      - name: 'npm: warm install (download cache present)'
        run: |
          Remove-Item -Recurse -Force node_modules
          $start = Get-Date
          npm ci --no-fund --no-audit 2>&1 | Select-Object -Last 3
          $elapsed = (Get-Date) - $start
          Write-Output "npm warm: $([math]::Round($elapsed.TotalSeconds))s"
        shell: pwsh

      - name: 'npm: warm + prefer-offline'
        run: |
          Remove-Item -Recurse -Force node_modules
          $start = Get-Date
          npm ci --prefer-offline --no-fund --no-audit 2>&1 | Select-Object -Last 3
          $elapsed = (Get-Date) - $start
          Write-Output "npm warm+offline: $([math]::Round($elapsed.TotalSeconds))s"
        shell: pwsh

      - name: 'npm: measure node_modules size'
        run: |
          node -e "const {readdirSync,lstatSync}=require('fs'),{join}=require('path');function s(d){let t=0;try{for(const f of readdirSync(d)){const p=join(d,f),st=lstatSync(p);t+=st.isDirectory()?s(p):st.size}}catch{}return t}console.log((s('node_modules')/1024/1024|0)+' MB')"
        shell: bash

      # === npm two-step benchmarks (incremental install with lockfile validation) ===

      # The idea: restore stale node_modules from cache, validate lockfile with
      # npm ci --dry-run, then incrementally update via npm install --no-save.
      # This avoids npm ci's destructive node_modules deletion.

      - name: 'npm two-step: hot (node_modules matches lockfile)'
        run: |
          $start = Get-Date
          npm ci --dry-run --ignore-scripts --no-fund --no-audit 2>&1 | Select-Object -Last 3
          npm install --no-save --prefer-offline --no-audit --no-fund 2>&1 | Select-Object -Last 3
          $elapsed = (Get-Date) - $start
          Write-Output "npm two-step hot: $([math]::Round($elapsed.TotalSeconds))s"
        shell: pwsh

      - name: 'npm two-step: warm (stale node_modules, 1 pkg removed)'
        run: |
          # Simulate a small dependency change: remove one package from node_modules
          Remove-Item -Recurse -Force node_modules\typescript -ErrorAction SilentlyContinue
          $start = Get-Date
          npm ci --dry-run --ignore-scripts --no-fund --no-audit 2>&1 | Select-Object -Last 3
          npm install --no-save --prefer-offline --no-audit --no-fund 2>&1 | Select-Object -Last 3
          $elapsed = (Get-Date) - $start
          Write-Output "npm two-step warm (1 pkg delta): $([math]::Round($elapsed.TotalSeconds))s"
        shell: pwsh

      - name: 'npm two-step: cold (no node_modules, download cache present)'
        run: |
          Remove-Item -Recurse -Force node_modules
          $start = Get-Date
          npm ci --dry-run --ignore-scripts --no-fund --no-audit 2>&1 | Select-Object -Last 3
          npm install --no-save --prefer-offline --no-audit --no-fund 2>&1 | Select-Object -Last 3
          $elapsed = (Get-Date) - $start
          Write-Output "npm two-step cold (no node_modules): $([math]::Round($elapsed.TotalSeconds))s"
        shell: pwsh

      # === pnpm benchmarks ===

      - name: Install pnpm
        run: npm install -g pnpm

      - name: 'pnpm: import lockfile'
        run: pnpm import

      - name: 'pnpm: cold install (no caches)'
        run: |
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          pnpm store prune
          $start = Get-Date
          pnpm install --frozen-lockfile 2>&1 | Select-Object -Last 5
          $elapsed = (Get-Date) - $start
          Write-Output "pnpm cold: $([math]::Round($elapsed.TotalSeconds))s"
        shell: pwsh

      - name: 'pnpm: warm install (store present)'
        run: |
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          $start = Get-Date
          pnpm install --frozen-lockfile 2>&1 | Select-Object -Last 5
          $elapsed = (Get-Date) - $start
          Write-Output "pnpm warm: $([math]::Round($elapsed.TotalSeconds))s"
        shell: pwsh

      - name: 'pnpm: hot install (store + node_modules present)'
        run: |
          $start = Get-Date
          pnpm install --frozen-lockfile 2>&1 | Select-Object -Last 5
          $elapsed = (Get-Date) - $start
          Write-Output "pnpm hot: $([math]::Round($elapsed.TotalSeconds))s"
        shell: pwsh

      - name: 'pnpm: measure node_modules size'
        run: |
          node -e "const {readdirSync,lstatSync}=require('fs'),{join}=require('path');function s(d){let t=0;try{for(const f of readdirSync(d)){const p=join(d,f),st=lstatSync(p);t+=st.isDirectory()?s(p):st.size}}catch{}return t}console.log((s('node_modules')/1024/1024|0)+' MB')"
        shell: bash

      # === Summary ===

      - name: Write benchmark summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "## Package Manager Benchmark (windows-11-arm)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See individual step logs for detailed timing." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scenario | Description |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cold | All caches cleared, download from registry |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Warm | Global cache present, no node_modules |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Hot | Global cache + node_modules present |" >> "$GITHUB_STEP_SUMMARY"
